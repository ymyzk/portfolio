version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "node"
        versions: ["27"]
    groups:
      monthly-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      monthly-major:
        patterns:
          - "*"
        update-types:
          - "major"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      monthly-batch:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    # eslint-config-next and its bundled plugins (eslint-plugin-react / import / jsx-a11y)
    # do not support ESLint v10 yet: https://github.com/vercel/next.js/issues/89764
    ignore:
      - dependency-name: "eslint"
        versions: ["10.x"]
    groups:
      monthly-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      monthly-major:
        patterns:
          - "*"
        update-types:
          - "major"
